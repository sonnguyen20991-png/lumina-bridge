name: Lumina CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Check runtime syntax
        run: |
          node --check index.js
          node --check authz.js
          node --check importer.js
          node --check product-routes.js
          node --check conflict-routes.js
          node --check campaign-routes.js
          node --check gate1-routes.js
          node --check icp-routes.js
          node --check import-review-routes.js
          node --check company-resolver.js
          node --check suppression-resolver.js

      - name: Verify frontend build files
        run: |
          test -f frontend-dist/index.html
          test -f frontend-dist/assets/app-5229a0f0d3c0.css
          test -f frontend-dist/assets/app-7866c0ddc472-csvux8.js
