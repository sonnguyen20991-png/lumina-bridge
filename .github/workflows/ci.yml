name: Lumina CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Check runtime syntax
        run: |
          node --check index.js
          node --check authz.js
          node --check importer.js
          node --check product-routes.js
          node --check conflict-routes.js
          node --check campaign-routes.js
          node --check gate1-routes.js
          node --check icp-routes.js
          node --check import-review-routes.js
          node --check company-resolver.js
          node --check suppression-resolver.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend deployment package
        run: |
          test -f frontend-dist/index.html

          css_count=$(find frontend-dist/assets -maxdepth 1 -type f -name 'index-*.css' | wc -l)
          js_count=$(find frontend-dist/assets -maxdepth 1 -type f -name 'index-*.js' | wc -l)

          test "$css_count" -eq 1
          test "$js_count" -eq 1

          diff -rq frontend/dist frontend-dist
